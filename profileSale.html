<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home Page</title>
    <link rel = "stylesheet" href = "styles/profileSaleStyles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@200..900&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <a href = "index.html">
            <h1>Prosto.</h1>
        </a>

        <section class = "searchBox">
            <input placeholder = "Пошук">

            <div class = "buttonHeader">
                <img src = "assets/search.png" alt = "search">
            </div>
        </section>

        <section class = "buttonsBox">
            <div class = "buttonHeader">
                <img src = "assets/cart.png" alt = "cart">
            </div>

            <a href = "profile.html">
                <div class = "buttonHeader">
                    <img src = "assets/profile.png" alt = "profile">
                </div>
            </a>
        </section>
    </header>

    <main>
        <article>
            <section class = "mainInfo">
                <h2>Юридична особа</h2>

                <section class = "userList">
                    <div class = "userInput">
                        <label for="compName">Назва компанії</label>
                        <input type="text" id="compName">
                    </div>

                    <div class = "userInput">
                        <label for="edrpou">ЄДРПОУ</label>
                        <input type="text" id="edrpou">
                    </div>

                    <div class = "userInput">
                        <label for="iban">IBAN</label>
                        <input type="text" id="iban">
                    </div>

                    <div class = "userInput">
                        <label for="type">Тип компанії</label>
                        <input type="text" id="type">
                    </div>
                </section>

                <button class = "saveButton">Зберегти</button>
            </section>

            <section class = "mainInfo">
                <h2>Узагальнена інформація</h2>

                <section class = "saleInfo">
                    <section class = "additionalList">
                        <div class = "userInput">
                            <label for="category">Категорія зайнятості</label>
                            <input type="text" id="category">
                        </div>

                        <div class = "userInput">
                            <label for="saleAddress">Юридична адреса</label>
                            <input type="text" id="saleAddress">
                        </div>

                        <div class = "userInput">
                            <label for="saleFactory">Адреса потужностей</label>
                            <input type="text" id="saleFactory">
                        </div>
                    </section>

                    <div class = "saleDescription">
                        <label for="description">Короткий опис</label>
                        <textarea id="description"></textarea>
                    </div>
                </section>

                <button class = "saveButton">Зберегти</button>
            </section>
        </article>

        <aside>
            <p>Додати новий товар</p>
            <p>Тех підтримка</p>
            <p>Контакти</p>
            <p>Вихід</p>
        </aside>
    </main>

    <footer>
        <div class = "footerInfo">
            <p>Головна</p>
            <a href = "contacts.html">Котакти</a>
            <p>Профіль</p>
        </div>

        <h3>Prosto.</h3>

        <div class = "footerInfo">
            <p>095 345 67 89</p>
            <p>example@gmail.com</p>
            <p>м . Київ, вул. Володимирська 7</p>
        </div>
    </footer>
</body>
</html>
