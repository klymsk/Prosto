<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home Page</title>
    <link rel = "stylesheet" href = "styles/cartStyles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@200..900&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <a href = "index.html">
            <h1>Prosto.</h1>
        </a>

        <section class = "searchBox">
            <input placeholder = "Пошук">

            <div class = "buttonHeader">
                <img src = "assets/search.png" alt = "search">
            </div>
        </section>

        <section class = "buttonsBox">
            <div class = "buttonHeader">
                <img src = "assets/cart.png" alt = "cart">
            </div>

            <a href = "profile.html">
                <div class = "buttonHeader">
                    <img src = "assets/profile.png" alt = "profile">
                </div>
            </a>
        </section>
    </header>

    <main>
        <article>
            <section class = "mainInfo">
                <h2>Контактні дані</h2>

                <section class = "userList">
                    <div class = "userInput">
                        <label for="firstName">Ім’я</label>
                        <input type="text" id="firstName">
                    </div>

                    <div class = "userInput">
                        <label for="firstName">Прізвище</label>
                        <input type="text" id="surName">
                    </div>

                    <div class = "userInput">
                        <label for="firstName">Номер телефону</label>
                        <input type="text" id="phoneNum">
                    </div>

                    <div class = "userInput">
                        <label for="firstName">Електронна пошта</label>
                        <input type="text" id="email">
                    </div>
                </section>

                <button class = "saveButton">Зберегти</button>
            </section>

            <section class = "mainInfo">
                <h2>Доставка</h2>

                <section class = "deliveryInfo">
                    <section class = "deliveryList">
                        <div class = "userInput">
                            <label for="category">Оберіть спосіб доставки</label>
                            <input type="text" id="category">
                        </div>

                        <div class = "userInput">
                            <label for="saleAddress">Оберіть час доставки</label>
                            <input type="text" id="saleAddress">
                        </div>
                    </section>

                    <div class = "userInput">
                        <label for="description">Короткий опис</label>
                        <iframe src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d7185.580444813228!2d30.51118820763103!3d50.450667895488614!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e0!3m2!1suk!2sua!4v1760276331188!5m2!1suk!2sua" width="390" height="200" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
                    </div>
                </section>

                <button class = "saveButton">Зберегти</button>
            </section>

            <section class = "mainInfo">
                <h2>Оплата</h2>

                <section class = "payInfo">
                    <section class = "payList">
                        <div class = "userInput">
                            <label for="category">Оберіть спосіб оплати</label>
                            <input type="text" id="category">
                        </div>

                        <div class = "userInput">
                            <label for="saleAddress">Оберіть сервіс для оплати</label>
                            <input type="text" id="saleAddress">
                        </div>
                    </section>

                    <div class = "userInput">
                        <label for="description">Введіть промо-код</label>
                        <input type="text" id="saleAddress">
                        <button class = "promoButton">Застосувати</button>
                    </div>
                </section>

                <button class = "saveButton">Зберегти</button>
            </section>
        </article>

        <aside>
            <section class = "itemsList">
                <section class = "item">
                    <img src = "assets/item/iphoneItem.png" alt = "item">
                    <div class = "itemInfo">
                        <p>Iphone 17 Pro 256GB Deep Blue</p>
                        <span>63 999 ₴</span>
                    </div>
                </section>

                <section class = "item">
                    <img src = "assets/item/iphoneItem.png" alt = "item">
                    <div class = "itemInfo">
                        <p>Iphone 17 Pro 256GB Deep Blue</p>
                        <span>63 999 ₴</span>
                    </div>
                </section>
            </section>
            
            <section class = "buySection">
                <div class = "finalPrice">
                    <p>До сплати:</p>
                    <span>127 998 ₴</span>
                </div>

                <button>Підтвердити</button>
            </section>
        </aside>
    </main>

    <footer>
        <div class = "footerInfo">
            <p>Головна</p>
            <a href = "contacts.html">Котакти</a>
            <p>Профіль</p>
        </div>

        <h3>Prosto.</h3>

        <div class = "footerInfo">
            <p>095 345 67 89</p>
            <p>example@gmail.com</p>
            <p>м . Київ, вул. Володимирська 7</p>
        </div>
    </footer>
</body>
</html>
